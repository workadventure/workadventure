# Configuration of the "front" image (play/Dockerfile, --target front).
# Every file may be loaded from another origin (the play domain, white-label domains): CORS is open to all.
# Cache-Control is only set on successful responses: a 404 (e.g. a new hash asked to an old pod during a
# rollout) must not be cached by the CDN.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Content-hashed by Vite: never changes.
    location /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The template the pusher polls: always revalidated.
    location = /index.html {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
}
