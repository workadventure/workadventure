<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../assets/logo-128.png">
<title>NG Academy — اجتماعات المدير</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="shell">
  <div class="frame frame-table">
    <div class="content">
      <h3 style="color:var(--navy);margin-bottom:10px">🤝 طاولة الاجتماعات — الجدول والحجز</h3>
      <div class="rowlist" id="list"></div>
      <div class="form-row">
        <input id="who" placeholder="اسم المشاركين">
        <input id="when" placeholder="موعد (مثال: الثلاثاء ١٤:٠٠)">
        <button class="btn" id="addBtn">حجز</button>
      </div>
      <p class="muted" style="margin-top:8px">عند فتح هذا الطلب من الطاولة داخل العالم تنطلق <b>غرفة اجتماعات صوتية مباشرة</b> (Jitsi) على الطاولة.</p>
    </div>
  </div>
  <div class="hint">💡 <b>طاولة الاجتماعات</b> في الركن الجنوبي الغربي للمكتب — مقاعد ودفاتر مفتوحة. Esc للعودة.</div>
</div>
<script src="shared.js"></script>
<script>
NGA.shell("اجتماعات المدير");
let items = NGA.store("meetings", [
  ["مجلس التدبير الأسبوعي", "الإثنين ٩:٠٠", "قاعة الاجتماعات", true],
  ["فريق النشاطات — مسيرة الخميس", "الثلاثاء ١٤:٠٠", "طاولة المكتب", true],
  ["لقاء مفتوح مع أولياء أمور الصف الرابع", "الأحد ١٠:٠٠", "قاعة الاجتماعات", false],
]);
function draw() {
  document.getElementById("list").innerHTML = items.map((it, i) => `
    <div class="rowitem">
      <div><b>${it[0]}</b><div class="muted">${it[1]} — ${it[2]}</div></div>
      <div>
        ${it[3] ? '<span class="tag ok">محجوز</span> <button class="btn ghost" data-i="' + i + '" onclick="cancelM(' + i + ')">إلغاء</button>'
                : '<button class="btn" onclick="bookM(' + i + ')">حجز</button>'}
      </div>
    </div>`).join("");
}
function bookM(i) { items[i][3] = true; NGA.save("meetings", items); draw(); }
function cancelM(i) { items[i][3] = false; NGA.save("meetings", items); draw(); }
draw();
document.getElementById("addBtn").onclick = () => {
  const w = document.getElementById("who").value.trim();
  const t = document.getElementById("when").value.trim();
  if (!w || !t) return;
  items = [[w, t, "طاولة المكتب", true], ...items];
  NGA.save("meetings", items); draw();
  document.getElementById("who").value = ""; document.getElementById("when").value = "";
};
</script>
</body>
</html>
