[workspace]
resolver = "3"
members = ["crates/proto", "crates/core", "crates/server", "crates/bot"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
wa-proto = { path = "crates/proto" }
wa-core = { path = "crates/core" }

axum = { version = "0.8.9", features = ["ws", "multipart", "http2"] }
bytes = "1"
dashmap = "6.1"
parking_lot = "0.12"
prometheus = { version = "0.14", features = ["process"] }
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = "line-tables-only"
