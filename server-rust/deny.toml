# cargo deny check: known advisories, licences compatible with the repository's AGPL, duplicate crates, sources.
[graph]
all-features = false

[advisories]
version = 2

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "MPL-2.0", "AGPL-3.0-only", "AGPL-3.0-or-later", "0BSD", "BSL-1.0", "OpenSSL"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
