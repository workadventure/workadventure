[package]
name = "wa-server"
description = "The WorkAdventure server: pusher, back, map-storage and uploader in one process."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "workadventure-server"
path = "src/main.rs"

[dependencies]
wa-core.workspace = true
wa-proto.workspace = true
axum.workspace = true
base64 = "0.22"
bytes.workspace = true
dashmap.workspace = true
form_urlencoded = "1"
percent-encoding = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hmac = "0.13"
parking_lot.workspace = true
prometheus.workspace = true
prost.workspace = true
prost-types = "0.14"
# Plain HTTP is enough for the front container; TLS comes with the admin API.
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "query"] }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.11"
sha2 = "0.11"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
wa-bot = { path = "../bot" }

[lints]
workspace = true
