[package]
name = "wa-core"
description = "WorkAdventure business core: rooms, positions, zones, bubbles, spaces. No transport, no protobuf, no I/O."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Derives only, for the generated space state types (their JSON form is the state's contract with the front).
serde.workspace = true
# The WAM file stays JSON (wam.rs): the editor's fields this server does not know survive its edits.
serde_json.workspace = true
# EmoteValidator's Unicode properties (Extended_Pictographic, Emoji_Component).
regex = { version = "1", default-features = false, features = ["std", "unicode-bool"] }
unicode-normalization = "0.1.25"

[lints]
workspace = true
