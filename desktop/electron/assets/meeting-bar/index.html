<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
    <title>WorkAdventure meeting bar</title>
    <style>
        :root {
            color-scheme: dark;
            --fg: #f8fafc;
            --fg-muted: #94a3b8;
            --contrast: rgba(27, 42, 65, 0.92);
            --secondary: #4156F6;
            --secondary-hover: #5566ff;
            --danger: #E96D51;
            --danger-hover: #ef7e63;
        }
        html, body {
            margin: 0;
            height: 100%;
            background: transparent;
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Bottom-anchored: the pill stays pinned to the window's bottom edge, so when the window
           grows upward (setExpanded) the source picker / device panel / "…" menu open ABOVE it. */
        body { display: flex; flex-direction: column; justify-content: flex-end; }

        /* Source picker panel, revealed above the pill when the window is expanded. */
        #picker {
            flex: 1;
            min-height: 0;
            display: none;
            flex-direction: column;
            margin: 0 4px 8px;
            border-radius: 12px;
            background: var(--contrast);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        }
        #picker.visible { display: flex; }
        .pk-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .pk-title { font-size: 12px; font-weight: 600; letter-spacing: 0.3px; }
        #picker .pk-tabs { display: flex; gap: 4px; }
        #picker .pk-tab {
            background: rgba(255, 255, 255, 0.06);
            border: 0;
            color: var(--fg);
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 999px;
            cursor: pointer;
        }
        #picker .pk-tab.active { background: var(--secondary); }
        #picker .pk-tab:hover:not(.active) { background: rgba(255, 255, 255, 0.12); }
        .pk-close {
            -webkit-app-region: no-drag;
            background: rgba(255, 255, 255, 0.06);
            border: 0;
            color: var(--fg);
            font-size: 14px;
            padding: 3px 9px;
            border-radius: 4px;
            cursor: pointer;
            line-height: 1;
        }
        .pk-close:hover { background: rgba(255, 255, 255, 0.16); }

        /* Device picker panel (shares the picker chrome). */
        #devices {
            flex: 1;
            min-height: 0;
            display: none;
            flex-direction: column;
            margin: 0 4px 8px;
            border-radius: 12px;
            background: var(--contrast);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        }
        #devices.visible { display: flex; }
        .dv-body { flex: 1; overflow-y: auto; padding: 6px 8px 8px; }
        .dv-group {
            padding: 8px 4px 3px;
            font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em;
            text-transform: uppercase; color: var(--fg-muted);
        }
        .dv-item {
            -webkit-app-region: no-drag;
            display: flex; align-items: center; gap: 8px;
            width: 100%; padding: 8px 10px;
            background: transparent; border: 0; border-radius: 8px;
            color: var(--fg); font: inherit; font-size: 12.5px;
            text-align: left; cursor: pointer;
        }
        .dv-item:hover { background: rgba(255, 255, 255, 0.10); }
        .dv-check {
            flex: 0 0 auto; width: 16px; height: 16px;
            color: var(--secondary); visibility: hidden;
        }
        .dv-item.is-current .dv-check { visibility: visible; }
        .dv-check svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
        .dv-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dv-empty { color: var(--fg-muted); font-size: 12px; padding: 8px 10px; }
        #picker .pk-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            align-content: start;
        }
        #picker .pk-body.empty,
        #picker .pk-body.loading {
            display: grid;
            place-items: center;
            grid-template-columns: 1fr;
            color: var(--fg-muted);
            font-size: 12px;
        }
        #picker .pk-tile {
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            padding: 0;
            text-align: left;
        }
        #picker .pk-tile:hover {
            background: rgba(65, 86, 246, 0.18);
            border-color: rgba(65, 86, 246, 0.55);
        }
        #picker .pk-tile img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background: #000;
            display: block;
        }
        #picker .pk-tile .pk-tile-name {
            font-size: 11px;
            padding: 4px 6px;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--fg);
        }
        #picker .pk-note {
            grid-column: 1 / -1;
            color: var(--fg-muted);
            font-size: 11px;
            text-align: center;
            padding: 6px;
        }

        /* The meeting pill itself. Draggable (app-region), buttons opt out. */
        #bar {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            padding: 4px 4px 8px;
        }
        .pill {
            -webkit-app-region: drag;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            background: var(--contrast);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 5px 8px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        }
        .bar-btn {
            -webkit-app-region: no-drag;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--fg);
            padding: 0;
            transition: background-color 80ms ease;
        }
        .bar-btn:hover { background: rgba(255, 255, 255, 0.10); }
        .bar-btn.is-forbidden { background: var(--danger); }
        .bar-btn.is-forbidden:hover { background: var(--danger-hover); }
        .bar-btn.is-active { background: var(--secondary); }
        .bar-btn.is-active:hover { background: var(--secondary-hover); }
        .bar-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: transparent;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .bar-sep {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.18);
            margin: 0 4px;
            -webkit-app-region: no-drag;
        }
        .icon-only-on, .icon-only-off { display: none; }
        .bar-btn[data-state="on"] .icon-only-on { display: inline; }
        .bar-btn[data-state="off"] .icon-only-off { display: inline; }

        /* Drag handle (visual cue; the pill itself is the drag region). */
        .bar-handle {
            -webkit-app-region: drag;
            display: inline-flex;
            align-items: center;
            padding: 0 2px;
            margin-right: 6px;
            color: var(--fg-muted);
            cursor: grab;
        }
        .bar-handle svg { width: 20px; height: 22px; fill: currentColor; stroke: none; }

        /* Overflow menu — positioned by JS above the "…" button; the window grows (setExpanded). */
        #menu {
            position: fixed;
            bottom: 62px; /* just above the bar; the window grows upward (bottom-anchored) */
            display: none;
            flex-direction: column;
            min-width: 224px;
            padding: 6px;
            background: var(--contrast);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            -webkit-app-region: no-drag;
            z-index: 10;
        }
        #menu.visible { display: flex; }
        /* Caret joining the menu to the "…" button, so it's clear which button opened it (positioned
           by JS to sit under the button's centre). The menu always opens above the bar. */
        .mn-caret {
            position: absolute;
            bottom: -7px;
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 8px solid var(--contrast);
            transform: translateX(-50%);
            pointer-events: none;
        }
        .mn-item {
            -webkit-app-region: no-drag;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 9px 10px;
            background: transparent;
            border: 0;
            border-radius: 8px;
            color: var(--fg);
            font: inherit;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
        }
        .mn-item:hover { background: rgba(255, 255, 255, 0.10); }
        .mn-item.is-active { background: var(--secondary); }
        .mn-item.is-active:hover { background: var(--secondary-hover); }
        .mn-ico { display: inline-flex; flex: 0 0 auto; }
        .mn-ico svg {
            width: 18px; height: 18px;
            stroke: currentColor; fill: transparent;
            stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
        }
        .mn-label { flex: 1; }
        .mn-sep { height: 1px; margin: 5px 6px; background: rgba(255, 255, 255, 0.12); }
        .mn-toggle {
            flex: 0 0 auto;
            position: relative;
            width: 34px; height: 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            transition: background-color 120ms ease;
        }
        .mn-toggle::after {
            content: "";
            position: absolute;
            top: 2px; left: 2px;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: #fff;
            transition: transform 120ms ease;
        }
        .mn-item[aria-checked="true"] .mn-toggle { background: var(--secondary); }
        .mn-item[aria-checked="true"] .mn-toggle::after { transform: translateX(16px); }

        /* Annotation toolbar — a panel of the meeting bar (not a separate window), opened above the
           pill like the "…" menu while drawing mode is on. Draggability lives on the pill only. */
        #annotation {
            position: fixed;
            bottom: 62px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            align-items: center;
            gap: 2px;
            padding: 5px 8px;
            background: var(--contrast);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            -webkit-app-region: no-drag;
            white-space: nowrap;
            z-index: 10;
        }
        #annotation.visible { display: inline-flex; }
        .an-btn {
            -webkit-app-region: no-drag;
            cursor: pointer;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--fg);
            padding: 0;
            transition: background-color 80ms ease;
        }
        .an-btn:hover { background: rgba(255, 255, 255, 0.10); }
        .an-btn.is-active { background: var(--secondary); }
        .an-btn.is-active:hover { background: var(--secondary-hover); }
        .an-btn:disabled { opacity: 0.3; cursor: default; }
        .an-btn:disabled:hover { background: transparent; }
        .an-btn svg {
            width: 19px;
            height: 19px;
            stroke: currentColor;
            fill: transparent;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .an-sep { width: 1px; height: 20px; background: rgba(255, 255, 255, 0.18); margin: 0 3px; }
        .an-color {
            -webkit-app-region: no-drag;
            cursor: pointer;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid transparent;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25);
            padding: 0;
            margin: 0 1px;
        }
        .an-color.is-active { border-color: #fff; }
        #an-eye .icon-only-on, #an-eye .icon-only-off { display: none; }
        #an-eye[data-state="on"] .icon-only-on { display: inline; }
        #an-eye[data-state="off"] .icon-only-off { display: inline; }
        .an-caret {
            position: absolute;
            bottom: -7px;
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 8px solid var(--contrast);
            transform: translateX(-50%);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="picker" role="dialog" aria-label="Switch the shared screen">
        <div class="pk-header">
            <span class="pk-title">Switch what you share</span>
            <div class="pk-tabs">
                <button class="pk-tab active" type="button" data-kind="screen">Screens</button>
                <button class="pk-tab" type="button" data-kind="window">Windows</button>
            </div>
            <button class="pk-close" id="pk-cancel" type="button" aria-label="Cancel">×</button>
        </div>
        <div class="pk-body loading" id="pk-body">Loading sources…</div>
    </div>
    <!-- Device picker (grows the window like the source picker). Populated from the pushed state. -->
    <div id="devices" role="dialog" aria-label="Change camera or microphone">
        <div class="pk-header">
            <span class="pk-title">Camera &amp; microphone</span>
            <button class="pk-close" id="dv-cancel" type="button" aria-label="Close">×</button>
        </div>
        <div class="dv-body" id="dv-body"></div>
    </div>
    <!-- Overflow menu (grows the HUD window like the picker; anchored above the bar). -->
    <div id="menu" role="menu" aria-label="More options">
        <button class="mn-item" id="mn-laser" type="button" role="menuitemcheckbox">
            <span class="mn-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 12m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/><path d="M12 12m-5 0a5 5 0 1 0 10 0a5 5 0 1 0 -10 0"/><path d="M12 3l0 2"/><path d="M3 12l2 0"/><path d="M12 19l0 2"/><path d="M19 12l2 0"/></svg></span>
            <span class="mn-label">Cursor highlight</span>
        </button>
        <button class="mn-item" id="mn-spotlight" type="button" role="menuitemcheckbox">
            <span class="mn-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 12h1m8 -9v1m8 8h1m-15.4 -6.4l.7 .7m12.1 -.7l-.7 .7"/><path d="M9 16a5 5 0 1 1 6 0a3.5 3.5 0 0 0 -1 3a2 2 0 0 1 -4 0a3.5 3.5 0 0 0 -1 -3"/><path d="M9.7 17l4.6 0"/></svg></span>
            <span class="mn-label">Spotlight</span>
        </button>
        <button class="mn-item" id="mn-loupe" type="button" role="menuitemcheckbox">
            <span class="mn-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M7 10l6 0"/><path d="M10 7l0 6"/><path d="M21 21l-6 -6"/></svg></span>
            <span class="mn-label">Loupe</span>
        </button>
        <div class="mn-sep"></div>
        <button class="mn-item" id="mn-switch" type="button">
            <span class="mn-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 5m0 1a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1z"/><path d="M7 20h10"/><path d="M9 16v4"/><path d="M15 16v4"/><path d="M9 11l3 -3l3 3"/></svg></span>
            <span class="mn-label">Switch shared screen</span>
        </button>
        <button class="mn-item" id="mn-devices" type="button">
            <span class="mn-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M15 10l4.553 -2.276a1 1 0 0 1 1.447 .894v6.764a1 1 0 0 1 -1.447 .894l-4.553 -2.276v-4z"/><path d="M3 6m0 2a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2z"/></svg></span>
            <span class="mn-label">Change cam / mic</span>
        </button>
        <div class="mn-sep"></div>
        <button class="mn-item" id="mn-tabs" type="button" role="menuitemcheckbox" aria-checked="false">
            <span class="mn-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 5m0 1a1 1 0 0 1 1 -1h14a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-14a1 1 0 0 1 -1 -1z"/><path d="M4 9h16"/><path d="M9 5v4"/></svg></span>
            <span class="mn-label">Display tabs</span>
            <span class="mn-toggle" aria-hidden="true"></span>
        </button>
        <button class="mn-item" id="mn-settings" type="button">
            <span class="mn-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/></svg></span>
            <span class="mn-label">Other settings</span>
        </button>
        <button class="mn-item" id="mn-back" type="button">
            <span class="mn-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 11l-4 4l4 4m-4 -4h11a4 4 0 0 0 0 -8h-1"/></svg></span>
            <span class="mn-label">Back to WorkAdventure</span>
        </button>
        <span class="mn-caret" id="mn-caret" aria-hidden="true"></span>
    </div>
    <!-- Annotation toolbar (panel of this window; shown while drawing mode is on). -->
    <div id="annotation" role="toolbar" aria-label="Annotation tools">
        <button class="an-btn" id="an-undo" type="button" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 14l-4 -4l4 -4"/><path d="M5 10h11a4 4 0 1 1 0 8h-1"/></svg></button>
        <button class="an-btn" id="an-redo" type="button" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M15 14l4 -4l-4 -4"/><path d="M19 10h-11a4 4 0 1 0 0 8h1"/></svg></button>
        <button class="an-btn" id="an-eye" type="button" data-state="on" title="Hide annotations for me only" aria-label="Hide annotations locally">
            <svg class="icon-only-on" viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/><path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6"/></svg>
            <svg class="icon-only-off" viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10.585 10.587a2 2 0 0 0 2.829 2.828"/><path d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87"/><path d="M3 3l18 18"/></svg>
        </button>
        <div class="an-sep"></div>
        <button class="an-btn" data-tool="text" type="button" title="Text" aria-label="Text"><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M7 6h10"/><path d="M12 6v12"/></svg></button>
        <button class="an-btn" data-tool="line" type="button" title="Line" aria-label="Line"><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 19l14 -14"/></svg></button>
        <button class="an-btn" data-tool="rect" type="button" title="Rectangle" aria-label="Rectangle"><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 5h14v14h-14z"/></svg></button>
        <button class="an-btn" data-tool="eraser" type="button" title="Eraser" aria-label="Eraser"><svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M19 20h-10l-5 -5a1 1 0 0 1 0 -1.5l9 -9a1 1 0 0 1 1.5 0l5 5a1 1 0 0 1 0 1.5l-9 9"/></svg></button>
        <div class="an-sep"></div>
        <button class="an-color" data-color="#ff3b30" type="button" style="background:#ff3b30" title="Red" aria-label="Red"></button>
        <button class="an-color" data-color="#34c759" type="button" style="background:#34c759" title="Green" aria-label="Green"></button>
        <button class="an-color" data-color="#0a84ff" type="button" style="background:#0a84ff" title="Blue" aria-label="Blue"></button>
        <button class="an-color" data-color="#ffffff" type="button" style="background:#ffffff" title="White" aria-label="White"></button>
        <button class="an-color" data-color="#000000" type="button" style="background:#000000" title="Black" aria-label="Black"></button>
        <div class="an-sep"></div>
        <button class="an-btn" id="an-others" type="button" title="Allow others to annotate" aria-label="Allow others to annotate">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 7m0 2a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M3 21v-2a4 4 0 0 1 4 -4h2"/><path d="M15 7m0 2a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M13 21v-2a4 4 0 0 1 4 -4h2a4 4 0 0 1 2 .5"/></svg>
        </button>
        <span class="an-caret" id="an-caret" aria-hidden="true"></span>
    </div>
    <div id="bar">
        <div class="pill">
            <span class="bar-handle" id="bar-handle" aria-hidden="true">
                <svg viewBox="0 0 24 24"><circle cx="8" cy="5" r="1.5"/><circle cx="16" cy="5" r="1.5"/><circle cx="8" cy="12" r="1.5"/><circle cx="16" cy="12" r="1.5"/><circle cx="8" cy="19" r="1.5"/><circle cx="16" cy="19" r="1.5"/></svg>
            </span>
            <button class="bar-btn" id="bar-mic" type="button" data-state="on" title="Toggle microphone" aria-label="Toggle microphone">
                <svg class="icon-only-on" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                    <path d="M9 2m0 3a3 3 0 0 1 3 -3h0a3 3 0 0 1 3 3v5a3 3 0 0 1 -3 3h0a3 3 0 0 1 -3 -3z"/>
                    <path d="M5 10a7 7 0 0 0 14 0"/>
                    <path d="M8 21l8 0"/>
                    <path d="M12 17l0 4"/>
                </svg>
                <svg class="icon-only-off" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                    <path d="M3 3l18 18"/>
                    <path d="M9 5a3 3 0 0 1 6 0v5a3 3 0 0 1 -.13 .874m-2 2a3 3 0 0 1 -3.87 -2.872v-1"/>
                    <path d="M5 10a7 7 0 0 0 10.846 5.85m2 -2a6.967 6.967 0 0 0 1.152 -3.85"/>
                    <path d="M8 21l8 0"/>
                    <path d="M12 17l0 4"/>
                </svg>
            </button>
            <button class="bar-btn" id="bar-cam" type="button" data-state="on" title="Toggle camera" aria-label="Toggle camera">
                <svg class="icon-only-on" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                    <path d="M15 10l4.553 -2.276a1 1 0 0 1 1.447 .894v6.764a1 1 0 0 1 -1.447 .894l-4.553 -2.276v-4z"/>
                    <path d="M3 6m0 2a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2z"/>
                </svg>
                <svg class="icon-only-off" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                    <path d="M3 3l18 18"/>
                    <path d="M15 11v-1l4.553 -2.276a1 1 0 0 1 1.447 .894v6.764a1 1 0 0 1 -.675 .946"/>
                    <path d="M10 6h3a2 2 0 0 1 2 2v3m0 4v1a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-8a2 2 0 0 1 2 -2h1"/>
                </svg>
            </button>
            <button class="bar-btn is-active" id="bar-stop" type="button" title="Stop sharing your screen" aria-label="Stop sharing your screen">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                    <path d="M21 12v3a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1v-10a1 1 0 0 1 1 -1h9"/>
                    <path d="M7 20l10 0"/>
                    <path d="M9 16l0 4"/>
                    <path d="M15 16l0 4"/>
                    <path d="M17 4h4v4"/>
                    <path d="M16 9l5 -5"/>
                </svg>
            </button>
            <button class="bar-btn" id="bar-annotate" type="button" data-state="off" title="Annotate the shared screen" aria-label="Annotate the shared screen">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                    <path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4"/>
                    <path d="M13.5 6.5l4 4"/>
                </svg>
            </button>
            <button class="bar-btn" id="bar-more" type="button" title="More options" aria-label="More options" aria-haspopup="true" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor;stroke:none">
                    <circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/>
                </svg>
            </button>
        </div>
    </div>
    <script src="./renderer.js"></script>
</body>
