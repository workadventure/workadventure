version: "2"
run:
  tests: true
linters:
  default: none
  enable: [errcheck, govet, staticcheck, unused, ineffassign, gosec, bodyclose, misspell]
  settings:
    errcheck:
      # Closing what was only read (a response body, an uploaded file, a zip entry) and dropping a request's
      # temporary files cannot lose data: their errors are ignored. A written file's Close is still checked.
      exclude-functions:
        - (io.ReadCloser).Close
        - (io.Closer).Close
        - (mime/multipart.File).Close
        - (*mime/multipart.Form).RemoveAll
  exclusions:
    generated: strict
    paths: [internal/pb]
    # Baseline of the findings present when the linters were introduced: one rule = one file + one linter + one
    # message, so a NEW finding (another file or message) still fails the job. Fix them, then delete the rule.
    rules:
      # The load generator: math/rand positions and int32 coordinates of a test map are what it wants.
      - path: ^cmd/loadbot/
        linters: [gosec]
        text: 'G115|G404'
      # TODO(lint): gosec cmd/server/main.go:300
      - path: ^cmd/server/main\.go$
        linters: [gosec]
        text: 'G104: Errors unhandled'
      # TODO(lint): gosec cmd/server/main.go:295
      - path: ^cmd/server/main\.go$
        linters: [gosec]
        text: 'G704: SSRF via taint analysis'
      # TODO(lint): gosec internal/admin/admin.go:8
      - path: ^internal/admin/admin\.go$
        linters: [gosec]
        text: 'G505: Blocklisted import crypto/sha1: weak cryptographic primitive'
      # TODO(lint): gosec internal/admin/admin_test.go:24,28
      - path: ^internal/admin/admin_test\.go$
        linters: [gosec]
        text: 'G304: Potential file inclusion via variable'
      # TODO(lint): gosec internal/admin/http.go:370,456
