services:
  # Override for the Rust server (server-rust/) on the production compose file: it replaces the play (pusher), back,
  # map-storage and uploader containers. Use it last:
  # docker compose -f docker-compose.prod.yaml -f tests/docker-compose.test.yaml -f tests/docker-compose.server.yaml up -d
  # The TypeScript services stay defined, behind the "ts" profile.
  reverse-proxy:
    depends_on: !override
      play:
        condition: service_healthy
    # ACME cannot succeed locally, so Traefik would present its generated default certificate. The Rust server verifies
    # TLS (no "insecure" option), so Traefik serves the server certificate of tests/certs/ as its default one,
    # and play trusts the CA that signed it below (both generated by the CI job, see "Generate the certificates").
    # Traefik ignores environment variables once it has CLI arguments, so the command of the prod file is repeated
    # here, plus the file provider.
    command: !override
      - --log.level=${LOG_LEVEL}
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --entryPoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      - --entryPoints.grpc.address=:50051
      - --certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web
    volumes:
      - ./tests/certs:/certs:ro
      - ./tests/traefik-tls.yaml:/etc/traefik/dynamic/tls.yaml:ro

  play:
    image: thecodingmachine/workadventure-server-rust:${VERSION}
    # The image has no curl: the server's own healthcheck subcommand.
    healthcheck:
      test: ["CMD", "workadventure-server", "healthcheck"]
      interval: 5s
      timeout: 5s
      start_period: 3s
      retries: 20
    depends_on:
      redis:
        condition: service_started
      # /ready waits for the index.html template of the front container.
      front:
        condition: service_healthy
      rustfs-livekit-init:
        condition: service_completed_successfully
    volumes:
      - map-storage-data:/maps
      - ./tests/certs/ca.crt:/certs/ca.crt:ro
    environment:
      # rustfs serves plain http on the docker network; the workflow's https:// works for the TS back only because it
      # skips TLS checks. The server checks TLS.
      LIVEKIT_RECORDING_S3_ENDPOINT: http://rustfs-livekit:9000
      # Test only: SSL_CERT_FILE replaces the system CA bundle, so play trusts nothing but this CA.
      SSL_CERT_FILE: /certs/ca.crt
      # The server reads index.html from the front container, and proxies the assets that must stay same-origin
      # with the page (the page is served by the server, and so are /assets/ on the same domain).
      ASSETS_INTERNAL_URL: http://front
      # What the back used to read.
      PLAY_URL: https://${DOMAIN}
      GROUP_RADIUS: "${GROUP_RADIUS:-}"
      STORE_VARIABLES_FOR_LOCAL_MAPS: "${STORE_VARIABLES_FOR_LOCAL_MAPS:-}"
      PLAYER_VARIABLES_MAX_TTL: "${PLAYER_VARIABLES_MAX_TTL:-}"
      PROMETHEUS_AUTHORIZATION_TOKEN: "${PROMETHEUS_AUTHORIZATION_TOKEN:-}"
      LIVEKIT_HOST: "${LIVEKIT_HOST:-}"
      MAX_USERS_FOR_WEBRTC: "${MAX_USERS_FOR_WEBRTC:-}"
      # What the map-storage used to read.
      STORAGE_DIRECTORY: /maps
      PATH_PREFIX: /map-storage
      ENABLE_BEARER_AUTHENTICATION: "${MAP_STORAGE_ENABLE_BEARER_AUTHENTICATION:-}"
      ENABLE_BASIC_AUTHENTICATION: "${MAP_STORAGE_ENABLE_BASIC_AUTHENTICATION:-}"
      AUTHENTICATION_USER: "${MAP_STORAGE_AUTHENTICATION_USER:-}"
      AUTHENTICATION_PASSWORD: "${MAP_STORAGE_AUTHENTICATION_PASSWORD:-}"
      AUTHENTICATION_TOKEN: "${MAP_STORAGE_AUTHENTICATION_TOKEN:-}"
      ENTITY_COLLECTION_URLS: "https://${DOMAIN}/collections/FurnitureCollection.json,https://${DOMAIN}/collections/OfficeCollection.json"
      # What the uploader used to read.
      UPLOAD_MAX_FILESIZE: "${UPLOAD_MAX_FILESIZE:-}"
    labels:
      # The map-storage and the uploader are served by the same process, on their own ports.
      traefik.http.middlewares.strip-map-storage-prefix.stripprefix.prefixes: "/map-storage"
      traefik.http.routers.map-storage.middlewares: "strip-map-storage-prefix@docker"
      traefik.http.routers.map-storage.rule: "Host(`${DOMAIN}`) && PathPrefix(`/map-storage`)"
      traefik.http.routers.map-storage.entryPoints: "web"
      traefik.http.routers.map-storage.service: "map-storage"
      traefik.http.services.map-storage.loadbalancer.server.port: "3002"
      traefik.http.routers.map-storage-ssl.middlewares: "strip-map-storage-prefix@docker"
      traefik.http.routers.map-storage-ssl.rule: "Host(`${DOMAIN}`) && PathPrefix(`/map-storage`)"
      traefik.http.routers.map-storage-ssl.entryPoints: "websecure"
      traefik.http.routers.map-storage-ssl.service: "map-storage"
      traefik.http.routers.map-storage-ssl.tls: "true"
      traefik.http.routers.map-storage-ssl.tls.certresolver: "myresolver"
      traefik.http.middlewares.strip-uploader-prefix.stripprefix.prefixes: "/uploader"
      traefik.http.routers.uploader.middlewares: "strip-uploader-prefix@docker"
      traefik.http.routers.uploader.rule: "Host(`${DOMAIN}`) && PathPrefix(`/uploader`)"
      traefik.http.routers.uploader.entryPoints: "web"
      traefik.http.routers.uploader.service: "uploader"
      traefik.http.services.uploader.loadbalancer.server.port: "3003"
      traefik.http.routers.uploader-ssl.middlewares: "strip-uploader-prefix@docker"
      traefik.http.routers.uploader-ssl.rule: "Host(`${DOMAIN}`) && PathPrefix(`/uploader`)"
      traefik.http.routers.uploader-ssl.entryPoints: "websecure"
      traefik.http.routers.uploader-ssl.service: "uploader"
      traefik.http.routers.uploader-ssl.tls: "true"
      traefik.http.routers.uploader-ssl.tls.certresolver: "myresolver"

  # The compiled front (play/Dockerfile, target front): the server reads its index.html template.
  front:
    image: thecodingmachine/workadventure-front:${VERSION}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 5s
      timeout: 5s
      start_period: 3s
      retries: 20
    restart: ${RESTART_POLICY}

  back:
    profiles: [ts]
  map-storage:
    profiles: [ts]
  uploader:
    profiles: [ts]

volumes:
  map-storage-data:
