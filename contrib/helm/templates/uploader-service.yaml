apiVersion: v1
kind: Service
metadata:
  name: {{ include "workadventure.fullname" . }}-uploader
  labels:
    {{- include "workadventure.labels" . | nindent 4 }}
    role: uploader
spec:
  type: {{ .Values.uploader.service.type }}
  ports:
    - port: {{ .Values.uploader.service.port }}
      targetPort: {{ if .Values.server.enabled }}{{ .Values.server.uploaderPort }}{{ else }}http{{ end }}
      protocol: TCP
      name: http
  selector:
    {{- include "workadventure.selectorLabels" . | nindent 4 }}
    role: {{ if .Values.server.enabled }}play{{ else }}uploader{{ end }}
