name: Build & release desktop app

on:
  push:
    branches:
      - master
      - develop
  pull_request:
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_on_linux:
    name: "Build & release desktop app for ${{ matrix.os }}"

    strategy:
      # Build each OS independently: a flake on one (e.g. a transient GitHub download of the NSIS
      # tool on Windows) should not cancel the ubuntu/macOS builds.
      fail-fast: false
      matrix:
        node-version: [22.x]
        runtime: [ linux-x64, win-x64, osx-x64 ]
        include:
        - runtime: linux-x64
          os: ubuntu-latest

        - runtime: osx-x64
          os: macos-latest

        - runtime: win-x64
          os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v2.0.0"

      - name: "Setup NodeJS"
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "desktop/electron/package-lock.json"

      - name: Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.OS }}-electron-${{ hashFiles('desktop/electron/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-electron-

      - name: "Set desktop app version"
        run: node helpers/set-version.js
        working-directory: "desktop/electron"

      - name: "Install dependencies"
        run: npm ci
        working-directory: "desktop/electron"

      # tsup only strips the types: without these, a type error or a broken contract.test.ts
      # (what window.WAD exposes to world pages) would reach a release.
      - name: "Type-check and test"
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: npm run typecheck && npm test
        working-directory: "desktop/electron"

      - name: "Build typescript"
        run: npm run build
        working-directory: "desktop/electron"

      - name: "Build app for testing"
        run: npx electron-builder --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder skips signing on pull requests, the ad hoc one too (mac.identity "-"): the
          # artifact was then unsigned, and macOS cannot attach the screen recording, camera or
          # microphone permissions to an unsigned app. The ad hoc signature uses no secret. Revisit
          # once a Developer ID certificate is configured: it must not reach pull request builds.
          CSC_FOR_PULL_REQUEST: ${{ startsWith(matrix.os, 'macos') }}
        working-directory: "desktop/electron"
        if: ${{ github.event_name != 'release' }}

      # An unsigned macOS app cannot keep its screen recording, camera or microphone permissions.
      - name: "Check the macOS signature"
        if: ${{ github.event_name != 'release' && startsWith(matrix.os, 'macos') }}
        run: |
          app=$(find build -maxdepth 2 -name WorkAdventure.app | head -n 1)
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -E "Identifier|Signature"
        working-directory: "desktop/electron"

      # A fuse that does not fit the package (an app.asar that fails its integrity check, say) makes
      # the app abort at startup, on every user's machine: start it and check it still runs 15 s later.
      - name: "Check the packaged app starts"
        if: ${{ github.event_name != 'release' }}
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) app=build/linux-unpacked/workadventure-desktop ;;
            macOS) app="$(find build -maxdepth 2 -name WorkAdventure.app | head -n 1)/Contents/MacOS/WorkAdventure" ;;
            Windows) app=build/win-unpacked/WorkAdventure.exe ;;
          esac
          npx @electron/fuses read --app "$app"
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a "$app" --no-sandbox > startup.log 2>&1 &
          else
            "$app" > startup.log 2>&1 &
          fi
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            cat startup.log
            echo "The packaged app exited during startup"
            exit 1
          fi
          kill "$pid" || true
        working-directory: "desktop/electron"

      - name: "Build & release app"
        run: npx electron-builder --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: "desktop/electron"
        if: ${{ github.event_name == 'release' }}

      # electron-builder names the outputs after productName ("WorkAdventure-<version>...") and the
      # .deb after the package name ("workadventure-desktop_<version>_<arch>.deb"). Match by
      # extension (top level of build/ only — the unpacked app dirs are one level deeper) so the
      # globs survive version/arch changes. if-no-files-found: error turns a future naming drift into
      # a loud failure instead of a green run that silently uploaded nothing.
      - name: Upload Linux .AppImage artifact
        uses: actions/upload-artifact@v4
        if: startsWith(matrix.os, 'ubuntu')
        with:
          name: workadventure-desktop-linux-x64.AppImage
          path: desktop/electron/build/*.AppImage
          if-no-files-found: error

      - name: Upload Linux .deb artifact
        uses: actions/upload-artifact@v4
        if: startsWith(matrix.os, 'ubuntu')
        with:
          name: workadventure-desktop-linux-amd64.deb
          path: desktop/electron/build/*.deb
          if-no-files-found: error

      - name: Upload Windows .exe artifact
        uses: actions/upload-artifact@v4
        if: startsWith(matrix.os, 'windows')
        with:
          name: workadventure-desktop-win-x64.exe
          path: desktop/electron/build/*.exe
          if-no-files-found: error

      - name: Upload MacOS .dmg artifact
        uses: actions/upload-artifact@v4
        if: startsWith(matrix.os, 'macos')
        with:
          name: workadventure-mac.dmg
          path: desktop/electron/build/*.dmg
          if-no-files-found: error

  # apt.workadventu.re serves the apt-repo branch (the signed index, a few KB) and redirects
  # releases/download/... to the GitHub release, where electron-builder uploaded the .deb: apt checks
  # each download against the SHA256 in the signed index. The .deb's after-install script adds the
  # repository (desktop/electron/deb/).
  apt_repository:
    name: "Add the .deb to the APT repository"
    needs: build_on_linux
    # Not drafts (their downloads are not public yet) nor pre-releases (AppImage users do not get them).
    if: ${{ github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two releases at once would both push to the branch.
    concurrency: apt-repository

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Download the .deb"
        uses: actions/download-artifact@v4
        with:
          name: workadventure-desktop-linux-amd64.deb
          # dpkg-scanpackages writes this path as the package's Filename: the path of its GitHub download URL.
          path: ${{ runner.temp }}/releases/download/${{ github.ref_name }}

      - name: "Add it to the apt-repo branch and sign the index"
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          : "${APT_SIGNING_KEY:?Add the APT_SIGNING_KEY secret: the armored private key, without a passphrase}"
          key="$PWD/desktop/electron/deb/workadventure-desktop.gpg"
          if git fetch --depth 1 origin apt-repo; then
            git worktree add -B apt-repo "$RUNNER_TEMP/apt" FETCH_HEAD
          else
            git worktree add --orphan -b apt-repo "$RUNNER_TEMP/apt"
          fi
          cd "$RUNNER_TEMP"
          mkdir -p apt/packages
          # One file per release: a re-run replaces its own, and every earlier version stays installable.
          dpkg-scanpackages "releases/download/$TAG" > "apt/packages/$TAG"
          cd apt
          cat packages/* > Packages
          cp "$key" workadventure-desktop.gpg
          {
            echo "Origin: WorkAdventure"
            echo "Label: WorkAdventure"
            echo "Date: $(date -Ru)"
            echo "SHA256:"
            echo " $(sha256sum Packages | cut -d' ' -f1) $(stat -c %s Packages) Packages"
          } > Release
          gpg --batch --import <<< "$APT_SIGNING_KEY"
          gpg --batch --yes --clearsign -o InRelease Release
          gpg --batch --yes --armor --detach-sign -o Release.gpg Release
          # Every install trusts the key shipped in the .deb: it must be the one that signs.
          gpgv --keyring "$PWD/workadventure-desktop.gpg" InRelease
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "workadventure-desktop $TAG"
          git push origin apt-repo
